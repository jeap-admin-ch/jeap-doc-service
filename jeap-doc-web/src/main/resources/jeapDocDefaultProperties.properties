# Default properties of the jEAP doc service. Instances override what they need to.

# The documentation the doc service serves is self-contained: it loads no content from anywhere else. The jEAP
# web config starter applies these headers to the served documents; it skips /api and the actuator path.
# 'unsafe-inline' is needed for the script the site generator puts into every page to apply the colour mode
# before the page is painted, and 'wasm-unsafe-eval' for the diagram plugin, which compiles its rendering engine
# in the reader's browser. Both are same-origin: the documentation still loads nothing from anywhere else.
jeap.web.headers.content-security-policy=default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'
# No additional content sources: the starter would otherwise add the origin of the OAuth2 issuer to the policy,
# which the documentation does not talk to.
jeap.web.headers.additional-content-sources=

# Which paths the starter leaves without security headers, pinned rather than left at its defaults. Its default
# prefix is '/api' and its default suffix '-api', both matched against the first path segment - and a
# documentation site is served under a path segment that is only required to be a slug. A site called 'wvs-api'
# or 'api-gateway' would therefore be served with no Content-Security-Policy and no nosniff at all, silently and
# for every page of it. The trailing slash keeps /api/ itself skipped, which is what the setting is for.
jeap.web.headers.skip-path-prefixes=/api/,/actuator/
jeap.web.headers.skip-path-suffixes=

spring.jpa.open-in-view=false

# A documentation build runs on the scheduler, inline, for as long as jeap.doc.build.timeout allows. With Spring
# Boot's default of one thread it would hold the only one and stop every cron trigger and the nightly upload
# housekeeping while it ran, so the pool has room for them beside it.
spring.task.scheduling.pool.size=4

# The doc service serves no static resources of its own: the documentation comes from the object storage, and
# Spring Boot's catch-all /** resource handler would otherwise answer for every page of it - it is matched just
# ahead of the handler that serves the documentation. Switching it off leaves the resource handlers that other
# starters register (the Swagger UI's, for one) exactly where they are.
spring.web.resources.add-mappings=false

# A stopping instance finishes the requests it is in the middle of instead of cutting them: an upload is a
# bundle of up to 50MB, and a deployment landing on one would make a client retry a transfer it had all but
# completed.
server.shutdown=graceful

# Above jeap.doc.build.shutdown-timeout, so that giving up on a running documentation build is never the phase
# that is cut short. It applies per shutdown phase - the web server's, the build's and the scheduler's - so the
# stop timeout of the platform has to be a multiple of it: see docs/generation.md.
spring.lifecycle.timeout-per-shutdown-phase=20s

# The documentation is text throughout - HTML, the bundles, llms-full.txt and the search index the search bar
# downloads whole on first use - and none of it was compressed. An instance behind a compressing CDN can turn
# this off again.
server.compression.enabled=true
server.compression.min-response-size=1KB
server.compression.mime-types=text/html,text/plain,text/css,text/markdown,text/javascript,application/javascript,application/json,application/xml,image/svg+xml,application/wasm
