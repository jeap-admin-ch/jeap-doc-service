# Default properties of the jEAP doc service. Instances override what they need to.

# The documentation the doc service serves is self-contained: it loads no content from anywhere else. The jEAP
# web config starter applies these headers to the served documents; it skips /api and the actuator path.
jeap.web.headers.content-security-policy=default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'
# No additional content sources: the starter would otherwise add the origin of the OAuth2 issuer to the policy,
# which the documentation does not talk to.
jeap.web.headers.additional-content-sources=

spring.jpa.open-in-view=false

