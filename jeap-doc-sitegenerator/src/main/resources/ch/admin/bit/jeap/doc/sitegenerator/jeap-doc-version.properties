# Filtered by Maven while this module is built, so the version is the doc service's own.
#
# Deliberately not Spring Boot's build-info: an instance repackages its own jar, so that would report the
# version of the instance rather than of the service its site generator comes from. And deliberately not
# GitProperties, which on this classpath reports the commit of whichever starter contributed one.
version=@project.version@
